services:
  api:
    build:
      context: ../../backend
      dockerfile: ../ops/hostinger/Dockerfile.api
    env_file: ../../.env
    environment:
      DEV_AUTH: "false"
      DATABASE_URL: sqlite:///./storage/app.db
      CHROMA_DIR: ./storage/chroma
      HF_HOME: /app/model-cache
    volumes:
      - storage:/app/backend/storage
      - model_cache:/app/model-cache
      - ../../data:/app/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 20s
      timeout: 10s
      start_period: 10m
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: ../../frontend
      args:
        API_URL: http://api:8000
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:?Google client ID is required}
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  storage:
  model_cache:
  caddy_data:
  caddy_config:
