      **Day 4** รวมระบบ (M4) — ไล่ Demo 1–6 ตาม `09_INTEGRATION_ACCEPTANCE_RUNBOOK.md` + ทดสอบกรณีพัง
      **Day 5** แก้บั๊ก + ซ้อม + **Demo (M5)**

