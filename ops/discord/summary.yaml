channel: project-summary

posts:
  # ───────────────────────────── 1. เป้าหมาย ─────────────────────────────
  - pin: true
    content: "📖 **ห้องนี้คือภาพรวมโปรเจกต์ COPIE** อ่านจากบนลงล่างครั้งเดียว จะรู้ว่าเราทำอะไร หน้าตาเป็นยังไง และตัวเองอยู่ตรงไหน"
    title: "🎯 COPIE — AI Assistant ของภาควิชาวิศวกรรมคอมพิวเตอร์ RMUTT"
    color: 0x00B8D9
    image: assets/mockups/ui-flow-v1/04-chat-answer.png
    thumbnail: assets/web-ui/mascot/states/copie-front-laptop.png
    description: |
      **พูดง่าย ๆ:** เว็บที่ตอบคำถามเกี่ยวกับ **ภาควิชาวิศวกรรมคอมพิวเตอร์ RMUTT** ได้จริง — หลักสูตร รายวิชา การรับสมัคร ทุน ห้องแล็บ อาจารย์ ฯลฯ
      และช่วย **ประเมินทักษะ** ของผู้ใช้แล้วบอกว่าควรพัฒนาอะไรต่อ โดยมี **มาสคอต 3D ชื่อ COPIE** เป็นตัวแทน AI

      **สิ่งที่ทำให้ไม่ใช่ chatbot ธรรมดา**
      🧊 **มาสคอต 3D** อยู่กลางจอ เปลี่ยนสถานะตามการทำงาน (ฟัง → คิด → ตอบ) ไม่ใช่กล่องแชตเปล่า ๆ
      🧩 **Dynamic UI** — คำตอบไม่ใช่ข้อความอย่างเดียว แต่เป็น **ตารางรายวิชา / การ์ดข้อมูล / แบบประเมิน / กราฟเรดาร์** ตามชนิดคำถาม
      📚 **ตอบจากข้อมูลจริงของภาค** พร้อมแหล่งอ้างอิง — รายวิชา หน่วยกิต คะแนน **ห้ามให้ LLM แต่งเอง**
      🎓 **รู้จักผู้ใช้** — ถามชั้นปี/ความสนใจตอน onboarding แล้วปรับคำตอบให้เหมาะกับคนนั้น

      **ขอบเขต:** Mini Project **5 วัน** · เป้าหมายคือ *ระบบทำงานได้จริง ตอบถูก หน้าตาสวย มี 3D COPIE* — ไม่ต้องถึงระดับ production
      **ระบบเดียว:** frontend Next.js 1 แอป + backend FastAPI 1 แอป คุยกันผ่าน `/api/*` — แบ่งเป็น module ตามคน ไม่ได้แยก service

      โค้ด: {repo}

  # ───────────────────────────── 2. โฟลว์ ─────────────────────────────
  - pin: true
    title: "🔁 ระบบทำงานยังไง — เดินตามคำถาม 1 ข้อของผู้ใช้"
    color: 0x2E7DFF
    image: assets/mockups/ui-flow-v1/03-chat-composing.png
    description: |
      ผู้ใช้พิมพ์ **"ปี 2 เทอม 1 เรียนอะไรบ้าง"** แล้วกดส่ง — ข้อมูลจะวิ่งแบบนี้

      **1️⃣ หน้าเว็บ** {role:p1-core-mascot} — รับคำถาม เปลี่ยนมาสคอตเป็น *thinking* แล้วยิง `POST /api/chat`
      ⬇️
      **2️⃣ ระบบผู้ใช้** {role:p2-user} — บอกว่าคนถามคือใคร ชั้นปีอะไร สนใจอะไร (จาก login + onboarding) และเก็บประวัติการคุย
      ⬇️
      **3️⃣ สมองกลาง — Agent** {role:p3-agent} — อ่านคำถาม **แยกเจตนา (intent)** ว่าเป็นคำถามแบบไหน แล้วเลือกว่าจะเรียกใคร
      ⬇️ เรียกแบบขนาน
      **4️⃣ คลังความรู้ RAG** {role:p4-rag} — ค้นข้อมูลภาคฯ จากเอกสารจริง ส่งเนื้อหา + **แหล่งอ้างอิง** กลับมา
      **5️⃣ เครื่องมือหลักสูตร/ทักษะ** {role:p5-tools} — ดึงตารางรายวิชาจริง หรือสร้าง/ตรวจแบบประเมินทักษะ
      **7️⃣ ตัวแยก intent (ML)** {role:p7-suggest-ml} — โมเดลในเครื่องช่วยบอกว่าคำถามนี้ควรไปทางไหน
      ⬇️
      **3️⃣ Agent ประกอบคำตอบ** — เลือก `response_type` (`text` · `course_table` · `cards` · `assessment_form` · `skill_radar` · `error`) แล้วส่งกลับตาม **contract**
      ⬇️
      **6️⃣ ตัวเรนเดอร์** {role:p6-renderer} — แปลง response_type นั้นเป็นหน้าตาจริง (ตาราง/การ์ด/ฟอร์ม/กราฟ)
      ⬇️
      **1️⃣ หน้าเว็บ** แสดงผล + มาสคอตเป็น *responding* · **8️⃣** {role:p8-export-qa} ให้ผู้ใช้ copy/export คำตอบ และคอยวัดว่าระบบตอบถูกจริงไหม

      **กติกาของโฟลว์นี้**
      • ทุกคนคุยกันผ่าน **contract** (`contract.ts` / `contract.py`) เท่านั้น — เปลี่ยนต้องผ่าน {ch:contract} และ P1+P3 approve
      • ตารางเรียน/หน่วยกิต/คะแนน ต้องมาจากข้อมูลจริง ถ้าไม่มีข้อมูลให้ตอบว่าไม่มี **ห้ามเดา**
      • ส่วนไหนพัง ต้องตอบ `response_type: "error"` ให้ผู้ใช้เห็นปุ่มลองใหม่ — ไม่ใช่จอขาว

