      ติดเกิน **1 ชั่วโมง** → {ch:blockers} ทันที · 🔴 สองวันติด → ตัด scope หรือส่งคนไปช่วย

      **branch อายุไม่เกิน 1 วัน** — ทำชิ้นเล็ก merge ทุกวัน ดีกว่าดองยาวแล้ว conflict

  # ───────────────────────────── 6. เริ่มยังไง ─────────────────────────────
  - title: "🚀 เริ่มยังไง (ทำตามนี้ก่อนนอนวันนี้)"
    color: 0x00B8D9
    thumbnail: assets/web-ui/mascot/states/copie-success.png
    description: |
      1. เข้าห้องของตัวเอง (ชื่อขึ้นต้นด้วย P ของคุณ) → กด 📌 → อ่าน **ใบงาน** และ **คู่มือเริ่มงาน 3 ตอน**
      2. ติดตั้งเครื่องมือตามคู่มือตอน 1 แล้ว clone repo + `git config core.hooksPath .githooks`
      3. รันให้ขึ้นก่อน 1 รอบ (คู่มือตอน 2) — ยังไม่ต้องเขียนโค้ดจริง
      4. อ่าน 4 ไฟล์ใน `IMPLEMENTATION_PLANS/` ที่ขึ้นต้นด้วย `00_` แล้วค่อยอ่านแผนของตัวเอง
      5. ส่ง **GitHub username** ของคุณใน {ch:general} เพื่อให้เพิ่มเข้า repo และตั้ง CODEOWNERS

      **จำ 3 ข้อ:** ห้าม push ตรงเข้า `develop`/`main` · แก้เฉพาะโฟลเดอร์ตัวเอง · **ห้ามมีลายน้ำ AI**
      ไม่เข้าใจอะไรถามใน {ch:help} ได้เลย — ถามเร็วดีกว่าติดนาน 🙌
