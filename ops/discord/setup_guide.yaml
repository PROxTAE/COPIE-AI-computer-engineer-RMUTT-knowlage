# คู่มือเริ่มงานที่ปักหมุดในห้องของแต่ละคน — โพสต์ด้วย post_setup_guide.py
# 1 part = 1 ข้อความ (ทุก part ถูกปักหมุด · รันซ้ำ = แก้ข้อความเดิม ไม่โพสต์ซ้ำ)
#
# ตัวแปร (จาก config.yaml → workstreams[].dev): {key} {person} {modules} {folder} {folders}
#   {stack} {stack_label} {install} {run} {check} {open_url} {notes} {extra_block}
#   {branch_first} {default_branch} {repo}
# ใช้ {ch:<channel>} {role:<key>} ได้เหมือน summary.yaml

parts:
  # ─────────────────────────────── 1/3 ───────────────────────────────
  - title: "🛠️ เครื่องมือที่ {person} ต้องมี — 1/3 ติดตั้งครั้งเดียว"
    color: 0x00B8D9
    thumbnail: assets/web-ui/mascot/states/copie-front-laptop.png
    description: |
      **ส่วนที่คุณดูแล:** {stack_label} · โค้ดอยู่ที่ `{folder}`

      **ติดตั้งลงเครื่อง (ครั้งเดียว)**
      • **Git** — ถ้าพิมพ์ `git --version` แล้วไม่ขึ้น ให้โหลดจาก git-scm.com
      • **Node.js 22 LTS** (ถ้าทำ frontend) — nodejs.org · เช็ก `node -v` ต้องขึ้น v22.x
      • **Python 3.11** (ถ้าทำ backend) — python.org · **ตอนติดตั้งติ๊ก "Add python.exe to PATH"** · เช็ก `python --version`
      • **VS Code** + ส่วนขยาย: ESLint, Prettier, Python, Pylance
      • **บัญชี GitHub** ที่ถูกเชิญเข้า repo แล้ว (ถ้ายังไม่ได้รับคำเชิญ บอกใน {ch:help})

      **โคลนโปรเจกต์ + ตั้งค่า git (ครั้งเดียว)**
      ```bash
      git clone {repo}.git
      cd COPIE-AI-computer-engineer-RMUTT-knowlage
      git config core.hooksPath .githooks     # ⚠️ บังคับ — hook กันลายน้ำ AI และชื่อ branch ผิด
      git config user.name "ชื่อของคุณ"
      git config user.email "อีเมลที่ใช้กับ GitHub"
      cp .env.example .env                    # PowerShell: Copy-Item .env.example .env
      ```
      แล้วเปิด `.env` เติมค่าที่ต้องใช้ (ขอค่าที่เป็นความลับจากหัวหน้า) — **ห้าม commit `.env` เด็ดขาด**

      **ตั้งค่าเครื่องมือ AI ของตัวเอง (ถ้าใช้)**
      กติกาข้อ 9: ห้ามมีลายน้ำ AI ใน commit/PR/code และห้าม commit `.claude/` `.cursor/` `CLAUDE.md` ฯลฯ
      → ปิดการเติม "Co-Authored-By" / "Generated with ..." ในเครื่องมือของคุณตั้งแต่วันนี้ · hook + CI ตรวจทุก push

  # ─────────────────────────────── 2/3 ───────────────────────────────
