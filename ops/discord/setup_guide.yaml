    color: 0x00B8D9
    description: |
      **ติดตั้ง dependency (ครั้งแรก และทุกครั้งที่มีคนเพิ่ม library)**
      ```bash
      {install}
      ```

      **รันเพื่อพัฒนา**
      ```bash
      {run}
      ```
      เปิดดูงานของคุณที่ {open_url}

      **เช็กก่อน push ทุกครั้ง** (CI รันชุดเดียวกัน ถ้าตรงนี้ผ่าน CI ก็ผ่าน)
      ```bash
      {check}
      ```
      {extra_block}
      💡 {notes}

  # ─────────────────────────────── 3/3 ───────────────────────────────
  - title: "🚀 วงจรทำงานประจำวัน — 3/3 (branch → PR → merge)"
    color: 0x10B981
    thumbnail: assets/web-ui/mascot/states/copie-success.png
    description: |
      **เริ่มงานใหม่ทุกครั้ง**
      ```bash
      git switch {default_branch}
      git pull --ff-only origin {default_branch}
      git switch -c {branch_first}          # ชื่อ = <module>/<feature> ของคุณเท่านั้น
      ```

      **ระหว่างทำ** — commit บ่อย ๆ เป็นก้อนเล็ก ข้อความเป็นภาษาอังกฤษบอกว่าทำอะไร
      ```bash
      git status
      git add <ไฟล์ที่ตั้งใจ>                 # อย่าใช้ git add . มันจะดูดไฟล์คนอื่น/ไฟล์ลับเข้ามา
      git commit -m "add hybrid search for department knowledge"
      ```

      **ก่อน 17:00 (PR Cutoff) ทุกวัน**
      ```bash
      git fetch origin && git rebase origin/{default_branch}
      # แก้ conflict (ถ้ามี) → รันคำสั่งเช็กใน part 2 ให้ผ่าน
      git push -u origin {branch_first}
      ```
      แล้วเปิด PR เข้า **`{default_branch}`** · กรอก template ให้ครบ · ขอ reviewer 1 คน · แปะลิงก์ใน {ch:pull-requests} ถ้าเร่ง

      **ถ้า CI แดง** → บอทจะแจ้งใน {ch:ci-status} พร้อมลิงก์ log · แก้แล้ว push ทับ branch เดิม
      **ถ้า conflict หลังคนอื่น merge** → บอทแจ้งใน {ch:merge-conflicts} พร้อมคำสั่ง rebase
      **ติดเกิน 1 ชั่วโมง** → {ch:blockers} + tag คนที่เกี่ยวข้อง อย่านั่งติดเงียบ ๆ
      **21:00** รายงานใน {ch:status} ตามฟอร์ม 🟢/🟡/🔴

      **ปัญหาที่เจอบ่อย**
      • `git push` แล้วโดน hook ปฏิเสธ → อ่านข้อความที่ hook บอก มักเป็นชื่อ branch ผิดหรือมีลายน้ำ AI ใน commit message
      • `npm run dev` ไม่ขึ้น / module not found → `npm ci` ใหม่ (มีคนเพิ่ม library)
      • `uvicorn` ไม่เจอ / ImportError → ลืม activate venv หรือยังไม่ `pip install -r requirements.txt`
      • แก้โค้ดแล้วหน้าเว็บไม่เปลี่ยน → ดูว่ารันอยู่คนละ terminal/port หรือลืม save · ลอง Ctrl+C แล้วรันใหม่
      • เผลอทำงานบน `{default_branch}` → `git switch -c {branch_first}` แล้ว commit ใหม่ได้เลย (ยังไม่ push ไม่มีปัญหา)
