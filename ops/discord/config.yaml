# ==========================================================================
# COPIE — Discord team config (โปรเจกต์ใหม่ ทีมเดิม 8 คน)
#
# ไฟล์นี้คือ "แหล่งความจริง" เดียวของโครงสร้างทีมบน Discord และ GitHub
#   - setup_discord.py  อ่านไฟล์นี้แล้วสร้าง/อัปเดต role, ห้อง, ใบงานปักหมุด, webhook
#                       และเก็บห้องของโปรเจกต์เก่า (archive:) ไว้แบบอ่านอย่างเดียว
#   - gen_github.py     อ่านไฟล์นี้แล้วสร้าง .github/CODEOWNERS
#   - workflows         ใช้ค่า module_map / role_ids / channel_ids ที่ setup พิมพ์ออกมา
#
# แก้โครงสร้างทีม → แก้ที่นี่ที่เดียว แล้วรัน setup_discord.py ใหม่ (idempotent)
# ห้ามใส่ token / webhook URL ในไฟล์นี้
# ==========================================================================

project:
  name: COPIE
  full_name: "COPIE — AI Assistant ภาควิชาวิศวกรรมคอมพิวเตอร์ RMUTT"
  repo_slug: PROxTAE/COPIE-AI-computer-engineer-RMUTT-knowlage
  default_branch: develop            # ทุก PR เข้า develop · main รับจาก develop/release เท่านั้น
  release_branch: main
  plans_dir: IMPLEMENTATION_PLANS
  contract_paths:                    # แตะไฟล์พวกนี้ = ต้องคุยก่อน + P1 และ P3 approve
    - frontend/src/types/contract.ts
    - backend/app/schemas/contract.py
    - IMPLEMENTATION_PLANS/00_API_AND_DATA_CONTRACTS.md
  # branch = <module>/<feature> โดย module ต้องอยู่ในรายการนี้ (ตรงกับ pre-push hook และ CI)
  branch_types: [core, mascot, user, agent, rag, tools, renderer, suggest, intent-ml,
                 export, qa, contract, hotfix, docs, release]
  channel_name_format: "{emoji}│{name}"   # ชื่อที่แสดงใน Discord; ชื่อ logical ยังเป็น name เฉย ๆ
  # branch prefix ที่มีเจ้าของมากกว่าหนึ่งคน (contract ต้อง approve ทั้ง P1 และ P3)
  extra_module_map:
    contract: [p1-core-mascot, p3-agent]
  assets_root: assets                      # path รูปในไฟล์นี้นับจาก root ของ repo

# --------------------------------------------------------------------------
# Roles: ป้ายชื่อล้วน permissions=0, hoist ให้เห็นกลุ่มในรายชื่อด้านขวา
# --------------------------------------------------------------------------
lead_role:
  name: lead
  modules: ["release", "docs", "hotfix"]   # branch พวกนี้ ping lead
  color: 0xFF6B35
  hoist: true
  github: PROxTAE

# --------------------------------------------------------------------------
# 8 คน = 8 workstream · key = ชื่อ role = ชื่อห้อง
# modules = branch prefix ที่ route มาหา role นี้ (branch คือ <module>/<feature>)
# github  = GitHub username (ใช้ทำ CODEOWNERS) — เช็กก่อนด้วย gh api users/<ชื่อ>
# --------------------------------------------------------------------------
