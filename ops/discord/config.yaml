# --------------------------------------------------------------------------
# เก็บของโปรเจกต์เก่า (SafetyTravel Assistant) — ทำครั้งเดียวด้วย --archive
# ย้ายห้องเก่าทั้งหมดไปหมวดเดียว เปลี่ยนชื่อเป็น sta-* ล็อกไม่ให้โพสต์ แต่ยังอ่านย้อนหลังได้
# (ไม่ลบอะไรทั้งสิ้น — ชื่อเดิมถูกปล่อยว่างให้โปรเจกต์ใหม่ใช้)
# --------------------------------------------------------------------------
archive:
  category: "📦 SafetyTravel (จบแล้ว · อ่านอย่างเดียว)"
  channel_prefix: "sta-"
  channel_emoji: "🔒"
  lock: true                      # deny SEND_MESSAGES ให้ @everyone
  delete_empty_categories: true   # ลบหมวดเก่าที่ย้ายห้องออกจนหมดแล้ว
  categories: ["📢 GENERAL", "🛠️ WORKSTREAMS", "🔗 INTEGRATION"]
  keep_categories: ["meeting"]    # หมวดที่ใช้ร่วมกันทั้งสองโปรเจกต์ ไม่ต้องแตะ
  keep_channels: ["topsecret"]    # ห้องที่สมาชิกสร้างเอง ไม่ใช่ของโปรเจกต์ — ปล่อยไว้ที่เดิม
  unhoist_roles: [01-web, 02-api, 03-agent, 04-external-data, 05-data-integration,
                  06-risk-knowledge, 07-decision-engine, 08-recommendation]

# --------------------------------------------------------------------------
# ห้องที่สคริปต์ดูแล (ห้องอื่นในเซิร์ฟเวอร์ไม่ถูกแตะ)
# emoji: ใส่หน้าชื่อห้องตาม channel_name_format · post_only: [role] = คนอื่นอ่านอย่างเดียว
# webhook: true = สร้าง incoming webhook ให้ GitHub Actions
# --------------------------------------------------------------------------
categories:
  - name: "📌 COPIE · ทั่วไป"
    channels:
      - name: announcements
        emoji: "📣"
        topic: "ประกาศจากหัวหน้าทีม — อ่านทุกข้อความ"
        post_only: [lead]
        webhook: true
      - name: project-summary
        emoji: "📖"
        topic: "ภาพรวมโปรเจกต์ COPIE: เป้าหมาย หน้าจอ โฟลว์ ใครทำอะไร — ถามเรื่องภาพรวมได้ที่นี่"
      - name: general
        emoji: "💬"
        topic: "คุยทั่วไป"
      - name: status
        emoji: "📅"
        topic: "Midday status 13:00 · Daily report 21:00 (รูปแบบใน 00_GIT_DELIVERY_RULES §13) · smoke test develop 19:00"
      - name: blockers
        emoji: "🚨"
        topic: "ติดเกิน 1 ชั่วโมง → โพสต์ที่นี่ + tag คนที่เกี่ยวข้องทันที ห้ามนั่งติดเงียบ ๆ"
      - name: help
        emoji: "🆘"
        topic: "ถามได้ทุกเรื่อง — บอกว่า module ไหน branch ไหน error อะไร ลองอะไรไปแล้ว"
      - name: role-draw
        emoji: "🎲"
        topic: "สุ่มแจก module ให้สมาชิก (python ops/discord/draw.py) — ผลสุดท้ายปักหมุดไว้"
        post_only: [lead]

  - name: "🧩 COPIE · MODULES"
    workstream_channels: true      # สร้างห้องหนึ่งต่อ workstream ชื่อ = key, topic = person + scope

  - name: "🔗 COPIE · INTEGRATION"
    channels:
      - name: pull-requests
        emoji: "🔀"
        topic: "GitHub แจ้ง PR เปิด / review / merge อัตโนมัติ — ping role เจ้าของ module · PR Cutoff 17:00"
        webhook: true
      - name: ci-status
        emoji: "🧪"
        topic: "ผล CI (ai-watermark / branch-name / frontend / backend) ของทุก PR และ develop"
        webhook: true
      - name: merge-conflicts
        emoji: "💥"
        topic: "PR ที่ conflict กับ develop หลังมีคน merge — เจ้าของต้อง rebase"
        webhook: true
      - name: contract
        emoji: "📜"
        topic: "แตะ contract.ts / contract.py / API ต้องคุยที่นี่ก่อน · Contract Freeze Day 1 12:00 · P1 + P3 approve"
        webhook: true

# --------------------------------------------------------------------------
# Webhook ที่ GitHub Actions ใช้ส่งข้อความ
