  url: "{repo_url}"
  thumbnail: assets/web-ui/mascot/states/copie-front-laptop.png
  footer: "COPIE · อัปเดตอัตโนมัติจาก ops/discord/config.yaml"
  description: |
    **ขอบเขตงานของคุณ**
    {scope}

    Repo: {repo_url} · branch งานทั้งหมดแตกจาก `{default_branch}`
  fields:
    - name: "📁 โฟลเดอร์ที่แก้ได้ (เฉพาะของตัวเอง)"
      value: "{folders}"
    - name: "📖 อ่านก่อนเริ่ม (ใน `{plans_dir}/`)"
      value: |
        1. `00_SHARED_PROJECT_CONTEXT.md`
        2. `00_API_AND_DATA_CONTRACTS.md`
        3. `00_GIT_DELIVERY_RULES.md`
        4. `00_TIMELINE_AND_SYNC.md` (+ `gantt.html`)
        5. {plans}
    - name: "🌿 เริ่มงาน (copy ไปวางได้เลย)"
      value: |
        ชื่อ branch = `<module>/<feature>` เช่น {branches}
        ```bash
        git switch {default_branch}
        git pull --ff-only origin {default_branch}
        git status                      # ต้องสะอาดก่อนเริ่ม
        git switch -c {branch_first}
        ```
        ครั้งแรกหลัง clone: `git config core.hooksPath .githooks`
    - name: "🚀 ก่อนเปิด PR (ทุกวันก่อน 17:00)"
      value: |
        ```bash
        git fetch origin && git rebase origin/{default_branch}
        # frontend: npm run lint && npm run build   ·   backend: ruff check . && python -m compileall app
        git push -u origin {branch_first}
        ```
        เปิด PR เข้า **`{default_branch}`** เท่านั้น กรอก template ให้ครบ ขอ reviewer 1 คน
    - name: "📏 กติกาที่ระบบบังคับ"
      value: |
        • ห้าม push ตรงเข้า `{default_branch}` / `{release_branch}` — ทุกอย่างผ่าน PR
        • แก้เฉพาะโฟลเดอร์ของตัวเอง · แตะ contract → `contract/*` PR ที่ P1 + P3 approve
        • **ห้ามมีลายน้ำ AI** ใน commit/PR/code และห้าม commit `.claude/` `.cursor/` `CLAUDE.md` (hook + CI ตรวจ)
        • ข้อมูลภาค/หลักสูตร/คะแนน ต้องจริงและมีแหล่งอ้างอิง ห้ามให้ LLM แต่ง
        • mock ใช้ได้ Day 1–3 เท่านั้น หลัง M3 ห้ามมี mock ใน flow จริง
        • branch อายุไม่เกิน 1 วัน — slice เล็ก merge ทุกวัน
    - name: "⏰ จังหวะประจำวัน"
      value: "09:00 stand-up · 13:00 status 1 บรรทัด · **17:00 PR cutoff** · 17:00–19:00 review/merge · 21:00 daily report ใน #status · ติดเกิน 1 ชม. → #blockers"
    - name: "🔔 บอทจะเตือนคุณที่ไหน"
      value: "ping @{key} ใน #pull-requests (เปิด/approve/merge) · #ci-status (CI แดง) · #merge-conflicts (ต้อง rebase) · ถามได้ที่ #help"
