name: Discord - CI status

# แจ้ง #ci-status เมื่อ workflow "CI" รันจบ — ping role เจ้าของ module จากชื่อ branch
# แจ้งเฉพาะ: ล้มเหลว, ถูกยกเลิก, หรือผ่านบน develop/main (PR ที่ผ่านเงียบ ๆ ไม่รบกวน)
#
# secret: DISCORD_WEBHOOK_CI · variables: DISCORD_ROLE_IDS, DISCORD_MODULE_MAP, DISCORD_EMBED_BASE_URL (optional)
# ชื่อใน `workflows:` ต้องตรงกับ `name:` ของ ci.yml (case-sensitive)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord message
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_CI }}
          ROLE_IDS: ${{ vars.DISCORD_ROLE_IDS }}
          MODULE_MAP: ${{ vars.DISCORD_MODULE_MAP }}
          EMBED_BASE: ${{ vars.DISCORD_EMBED_BASE_URL }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          COMMIT_MSG: ${{ github.event.workflow_run.head_commit.message }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK_URL}" ]; then echo "DISCORD_WEBHOOK_CI not set - skipping"; exit 0; fi
          : "${ROLE_IDS:={}}" "${MODULE_MAP:={}}"

          case "${BRANCH}" in
            develop|main) SHARED=true ;;
            *)            SHARED=false ;;
          esac
          if [ "${CONCLUSION}" = "success" ] && [ "${SHARED}" = "false" ]; then
            echo "green on a feature branch - stay quiet"; exit 0
          fi

          MOD="${BRANCH%%/*}"
          RIDS="$(jq -nc --argjson m "${MODULE_MAP}" --argjson r "${ROLE_IDS}" --arg k "${MOD}" '[($m[$k] // [])[] | $r[.] // empty]')"
          if [ "${SHARED}" = "true" ] && [ "${CONCLUSION}" != "success" ]; then
            # develop/main แดง = ทุกคนถูกบล็อก ไม่ใช่เรื่องของคนเดียว
            RIDS="$(jq -nc --argjson r "${ROLE_IDS}" --argjson x "${RIDS}" '($x + [$r.lead // empty, $r["p1-core-mascot"] // empty, $r["p3-agent"] // empty]) | unique')"
          fi
          MENTION="$(jq -r 'map("<@&\(.)>") | join(" ")' <<<"${RIDS}")"
          ALLOWED="$(jq -nc --argjson r "${RIDS}" '{parse: [], roles: $r}')"

          case "${CONCLUSION}" in
            success)   VERB="✅ ${RUN_NAME} ผ่านบน \`${BRANCH}\`";      COLOR=1096577;  IMG="copie-success.png" ;;
            failure)   VERB="❌ ${RUN_NAME} ล้มเหลวบน \`${BRANCH}\`";   COLOR=15749714; IMG="copie-no-answer.png" ;;
            cancelled) VERB="⏹️ ${RUN_NAME} ถูกยกเลิกบน \`${BRANCH}\`"; COLOR=16746015; IMG="" ;;
            *)         VERB="⚠️ ${RUN_NAME}: ${CONCLUSION} บน \`${BRANCH}\`"; COLOR=16746015; IMG="" ;;
          esac
          IMAGE_URL=""
          if [ -n "${EMBED_BASE}" ] && [ -n "${IMG}" ]; then IMAGE_URL="${EMBED_BASE%/}/${IMG}"; fi
          HINT=""
          if [ "${CONCLUSION}" = "failure" ]; then
            HINT="เปิด log ที่ลิงก์ด้านบน แก้แล้ว push เข้า branch เดิม · job ที่มักแดง: \`ai-watermark\` (ลายน้ำ AI ใน commit/diff), \`branch-name\`, \`frontend\` (npm run lint/build), \`backend\` (ruff + compileall)"
          fi
          PR_LINE=""
          if [ -n "${PR_NUMBER}" ]; then PR_LINE="PR #${PR_NUMBER} · "; fi
          FIRST_LINE="$(printf '%s' "${COMMIT_MSG}" | head -n 1)"

          jq -nc \
            --arg content "${MENTION} ${VERB}" --argjson am "${ALLOWED}" \
            --arg title "${PR_LINE}${FIRST_LINE}" --arg url "${RUN_URL}" --argjson color "${COLOR}" \
            --arg actor "${ACTOR}" --arg sha "${SHA:0:7}" --arg hint "${HINT}" --arg image "${IMAGE_URL}" \
            '{
              username: "COPIE GitHub",
              content: $content, allowed_mentions: $am,
              embeds: [{
                title: $title, url: $url, color: $color,
                description: (if $hint != "" then $hint else null end),
                fields: [{name: "By", value: $actor, inline: true}, {name: "Commit", value: ("`" + $sha + "`"), inline: true}],
                thumbnail: (if $image != "" then {url: $image} else null end),
                timestamp: (now | todate)
              }]
            } | .embeds[0] |= with_entries(select(.value != null))' \
          | curl -sS --fail-with-body -X POST -H "Content-Type: application/json" -d @- "${WEBHOOK_URL}"
