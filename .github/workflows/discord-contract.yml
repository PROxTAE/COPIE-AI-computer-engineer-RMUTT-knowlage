name: Discord - contract changes

# เตือนดัง ๆ ใน #contract เมื่อมีใครแตะ contract กลาง (กระทบทั้ง 8 คน)
#   - PR ที่แก้ contract เปิด/มี commit ใหม่ → @everyone "อย่าเพิ่ง approve จนกว่าจะคุยกันในห้องนี้"
#   - merge เข้า develop → "ทุกคนต้อง rebase ทันที"
#
# paths ด้านล่างต้องตรงกับ project.contract_paths ใน ops/discord/config.yaml
# secret: DISCORD_WEBHOOK_CONTRACT

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, closed]
    paths:
      - "frontend/src/types/contract.ts"
      - "backend/app/schemas/contract.py"
      - "IMPLEMENTATION_PLANS/00_API_AND_DATA_CONTRACTS.md"
  push:
    branches: [develop]
    paths:
      - "frontend/src/types/contract.ts"
      - "backend/app/schemas/contract.py"
      - "IMPLEMENTATION_PLANS/00_API_AND_DATA_CONTRACTS.md"

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Send Discord message
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_CONTRACT }}
          EMBED_BASE: ${{ vars.DISCORD_EMBED_BASE_URL }}
          ROLE_IDS: ${{ vars.DISCORD_ROLE_IDS }}
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          PUSHER: ${{ github.event.pusher.name }}
          COMPARE_URL: ${{ github.event.compare }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK_URL}" ]; then echo "DISCORD_WEBHOOK_CONTRACT not set - skipping"; exit 0; fi
          : "${ROLE_IDS:={}}"
          PATHS='frontend/src/types/contract.ts backend/app/schemas/contract.py IMPLEMENTATION_PLANS/00_API_AND_DATA_CONTRACTS.md'

          if [ "${EVENT_NAME}" = "push" ]; then
            FROM="${PUSH_BEFORE}"; TO="${PUSH_AFTER}"
          else
            FROM="${BASE_SHA}"; TO="${HEAD_SHA}"
          fi
          # shellcheck disable=SC2086
          STAT="$(git diff --stat "${FROM}" "${TO}" -- ${PATHS} 2>/dev/null | tail -n 1 || true)"
          # shellcheck disable=SC2086
          FILES="$(git diff --name-only "${FROM}" "${TO}" -- ${PATHS} 2>/dev/null | head -n 10 | sed 's/^/• `/; s/$/`/' || true)"

          # P1 และ P3 คือคนที่ต้อง approve contract ทุกครั้ง
          RIDS="$(jq -nc --argjson r "${ROLE_IDS}" '[$r["p1-core-mascot"] // empty, $r["p3-agent"] // empty]')"

          if [ "${EVENT_NAME}" = "push" ]; then
            TITLE="📜 CONTRACT เปลี่ยนบน develop แล้ว — ทุกคนต้องอ่านทันที"
            BODY="${PUSHER} merge การเปลี่ยน contract เข้า \`develop\`"$'\n\n'"${FILES}"$'\n\n'"ทุกคน: \`git fetch origin && git rebase origin/develop\` แล้วแก้โค้ดให้ตรง type ใหม่ก่อนทำงานต่อ"
            URL="${COMPARE_URL}"; COLOR=1096577; IMG="copie-success.png"
          elif [ "${ACTION}" = "closed" ]; then
            if [ "${PR_MERGED}" != "true" ]; then echo "contract PR closed without merge - no message"; exit 0; fi
            echo "merged - the push event will announce it"; exit 0
          else
            TITLE="📜 PR #${PR_NUMBER} แตะ CONTRACT — อย่าเพิ่ง approve"
            BODY="${PR_AUTHOR} (${ACTION}) branch \`${HEAD_REF}\`: **${PR_TITLE}**"$'\n\n'"${FILES}"$'\n\n'"กติกา (00_GIT_DELIVERY_RULES §6): contract ต้อง **P1 และ P3 approve ทั้งคู่** · คนที่ใช้ field ที่เปลี่ยนต้องตอบในห้องนี้ก่อน · หลัง Contract Freeze (Day 1 12:00) เปลี่ยนได้เฉพาะเรื่องที่ทำให้ระบบพัง"
            URL="${PR_URL}"; COLOR=16746015; IMG="copie-thinking.png"
          fi
          IMAGE_URL=""
          if [ -n "${EMBED_BASE}" ]; then IMAGE_URL="${EMBED_BASE%/}/${IMG}"; fi

          jq -nc \
            --arg title "${TITLE}" --arg body "${BODY}" --arg url "${URL}" --argjson color "${COLOR}" \
            --arg stat "${STAT:-n/a}" --arg image "${IMAGE_URL}" --argjson rids "${RIDS}" \
            '{
              username: "COPIE GitHub",
              content: (["@everyone"] + ($rids | map("<@&\(.)>")) | join(" ")),
              allowed_mentions: {parse: ["everyone"], roles: $rids},
              embeds: [{
                title: $title, url: $url, color: $color, description: $body,
                fields: [{name: "Diff", value: $stat}],
                thumbnail: (if $image != "" then {url: $image} else null end),
                timestamp: (now | todate)
              }]
            } | .embeds[0] |= with_entries(select(.value != null))' \
          | curl -sS --fail-with-body -X POST -H "Content-Type: application/json" -d @- "${WEBHOOK_URL}"
