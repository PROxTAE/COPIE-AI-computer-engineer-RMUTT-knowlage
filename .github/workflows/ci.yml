name: CI

on:
  pull_request:
    branches: [develop, main]

jobs:
  ai-watermark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commits, files and diff
        run: bash scripts/check-ai-watermark.sh --range "origin/${{ github.base_ref }}...${{ github.event.pull_request.head.sha }}"
      - name: Check PR title and description
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/check-ai-watermark.sh --text "$PR_TITLE"$'\n'"$PR_BODY"

  branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch naming rule
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$BASE_REF" == "main" ]]; then
            [[ "$HEAD_REF" == "develop" || "$HEAD_REF" == release/* ]] && exit 0
            echo "main รับ PR จาก develop หรือ release/* เท่านั้น"; exit 1
          fi
          re='^(core|mascot|user|agent|rag|tools|renderer|suggest|intent-ml|export|qa|contract|hotfix|docs|release)/[a-z0-9][a-z0-9.-]*$'
          [[ "$HEAD_REF" =~ $re ]] && exit 0
          echo "ชื่อ branch '$HEAD_REF' ไม่ตรงกติกา <module>/<feature>"; exit 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: hashFiles('frontend/package-lock.json') != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: hashFiles('frontend/package-lock.json') != ''
        run: npm ci
      - if: hashFiles('frontend/package-lock.json') != ''
        run: npm run lint --if-present
      - if: hashFiles('frontend/package-lock.json') != ''
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax and undefined-name check
        if: hashFiles('backend/app/**/*.py') != ''
        working-directory: backend
        run: |
          pip install ruff
          ruff check app --select E9,F63,F7,F82
          python -m compileall -q app
